<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    /* Sem isto, o container interno soma `height: 100%` com o próprio padding e passa
       de 810 para 944px — a moldura corta 134px de conteúdo pelo rodapé, e o corte só
       aparece na exportação. */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #c4c0ff; text-decoration: none; }
    a:hover { color: #fafffd; }
  </style>
</helmet>

<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: #1b135c; font-family: Inter, system-ui, sans-serif; color: #fafffd;">

  <div style="position: absolute; inset: 0; background: radial-gradient(70% 90% at 78% 12%, rgba(75,57,239,.72), transparent 62%), radial-gradient(60% 70% at 8% 96%, rgba(114,125,228,.3), transparent 66%);"></div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 96px;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-family: Outfit, sans-serif; font-size: 27px; font-weight: 400; letter-spacing: -.01em; color: rgba(250,255,253,.82);">oi</span>
      <span style="font-family: Outfit, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -.02em;">Bill</span>
      <svg width="34" height="17" viewBox="0 0 34 17" fill="none" style="margin-left: -2px;">
        <path d="M1.5 9.2 L6.6 14.3 L16.2 3" stroke="#fafffd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.5 9.2 L20.6 14.3 L32 2.5" stroke="#fafffd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div>
      <p style="margin: 0 0 26px; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: rgba(196,192,255,.9);">Desafio AI Engineer</p>

      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-size: 92px; font-weight: 700; line-height: 96px; letter-spacing: -.035em; max-width: 1060px; text-wrap: pretty;">
        Contas a pagar<br>que chegam por e-mail
      </h1>

      <p style="margin: 34px 0 0; font-size: 24px; line-height: 36px; max-width: 760px; color: rgba(250,255,253,.72);">
        Uma POC que captura cobranças, extrai os dados e — onde há dinheiro em jogo —
        <span style="color: #fafffd; font-weight: 500;">confere em vez de confiar</span>.
      </p>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; gap: 14px;">
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px); font-size: 14px; color: rgba(250,255,253,.88);">48 e-mails reais</span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px); font-size: 14px; color: rgba(250,255,253,.88);">0 erros</span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px); font-size: 14px; color: rgba(250,255,253,.88);">US$&nbsp;0,36</span>
      </div>
      <p style="margin: 0; font-size: 15px; color: rgba(250,255,253,.45);">Paulo Roberto</p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
