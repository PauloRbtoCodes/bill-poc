[project]
name = "billpoc"
version = "0.1.0"
description = "POC de contas a pagar a partir de e-mails — desafio Bill"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
billpoc = "billpoc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billpoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
